# Render Blueprint -- lets you deploy this with Render's "New Blueprint"
# flow instead of clicking through every field by hand. See
# aal-wheel-decision-making/README.md's "Deploying" section for the full
# walkthrough (account setup, connecting the repo, and setting the two
# secret env vars below, which this file deliberately does NOT fill in).
#
# This file MUST live at the repo root -- Render's Blueprint discovery only
# looks here, never in a subdirectory, even though the actual project lives
# one level down (see rootDir below). Learned this the hard way: an earlier
# version of this file sat at aal-wheel-decision-making/render.yaml and
# Render reported "Blueprint file render.yaml not found on master branch."
services:
  - type: web
    name: aal-wheel-advisor
    runtime: python
    plan: free
    rootDir: aal-wheel-decision-making
    buildCommand: pip install -r requirements.txt
    # --workers 1 is deliberate, not a typo: ScannerJob/IvRankJob run as
    # in-process background threads with in-memory state, backed by JSON
    # files on disk. A second worker process would run its own independent
    # copies of both -- duplicate, uncoordinated scans hitting Yahoo, and
    # two processes writing the same cache files. --threads lets the one
    # worker still serve several concurrent requests.
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT dashboard.app:app
    envVars:
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # Optional. Yahoo Finance blocks/challenges requests from Render's
      # shared IP range with a 401 "Invalid Crumb" error even though the
      # same calls work fine from a residential IP -- set this to a
      # residential/rotating proxy URL (e.g. "http://user:pass@host:port")
      # to route yfinance's traffic around that block. See
      # aal-wheel-decision-making/README.md's "Deploying" section.
      - key: YFINANCE_PROXY_URL
        sync: false
